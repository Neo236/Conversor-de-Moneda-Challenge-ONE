# Terminal web interactiva del Conversor, con portada branded. Auto-hosteable en tu
# red local:
#
#   export EXCHANGE_RATE_API_KEY=tu-clave      # gratis en exchangerate-api.com
#   docker compose -f docker-compose.web.yml up -d --build
#
# Después abrí http://IP-DE-ESTA-MAQUINA:8091 desde cualquier dispositivo de la LAN.
# nginx sirve la portada en / y hace de proxy a la terminal (ttyd) en /terminal/.
name: conversor-web

services:
  # ttyd + la app real. No se publica al host: solo la alcanza nginx por la red interna.
  terminal:
    build:
      context: .
      target: web
    image: conversor-web:local
    environment:
      # La clave vive solo acá, del lado del servidor: nunca viaja al navegador.
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
    expose:
      - "7681"
    restart: unless-stopped

  # La portada branded + reverse-proxy a la terminal. Es la única puerta al exterior.
  portada:
    image: nginx:alpine
    depends_on:
      - terminal
    ports:
      - "8091:80"
    volumes:
      - ./docker/portada.html:/usr/share/nginx/html/index.html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
