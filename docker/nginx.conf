# La portada branded en / y la terminal viva (ttyd) en /terminal/, bajo el mismo
# origen: así el iframe no cruza puertos y no hay líos de CORS ni de X-Frame-Options.
server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse-proxy a ttyd. Los headers Upgrade/Connection son los que dejan pasar el
    # websocket de la terminal; sin ellos la página carga pero no teclea.
    location /terminal/ {
        proxy_pass http://terminal:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
