plugins {
    id 'java'
    id 'application'
    // Fat-jar para los releases: java -jar conversor.jar, sin instalar nada más.
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.alura.conversor'
version = '1.0.0'

java {
    // Fija la versión con la que se compila sin depender del JDK que tenga cada máquina.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.alura.conversor.Main'
    // Si no, el script de installDist hereda el nombre del repositorio.
    applicationName = 'conversor'
}

tasks.named('run') {
    // La aplicación se maneja por teclado y JavaExec no conecta la entrada estándar
    // por su cuenta: sin esto, `gradle run` arranca y muere en la primera lectura.
    standardInput = System.in
}

repositories {
    mavenCentral()
}

dependencies {
    // Gson para parsear el JSON de la API
    implementation 'com.google.code.gson:gson:2.10.1'

    // SLF4J + Logback para el log
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('shadowJar') {
    // Un solo nombre estable, para que el link del release nunca cambie.
    archiveFileName = 'conversor.jar'
    mergeServiceFiles()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
