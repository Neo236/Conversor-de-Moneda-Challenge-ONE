name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # La suite no toca la red: el HttpClient se simula y la API no se consulta,
      # así que no hace falta ninguna API Key acá.
      - name: Tests
        run: ./gradlew test

      # installDist arma la distribución que usa el Dockerfile; shadowJar, el fat-jar
      # del release: si cualquiera se rompe, mejor enterarse acá y no al taguear.
      - name: Empaquetar
        run: ./gradlew installDist shadowJar
